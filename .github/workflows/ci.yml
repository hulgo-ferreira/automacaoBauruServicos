name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    services:
        docker:
            image: docker:20.10.21-dind
            options: --privileged

    steps:
        - name: Checkout repo da automação
          uses: actions/checkout@v4
        - name: Checkout repo da aplicação
          uses: actions/checkout@v4
          with:
            repository: lucasbdaj/bauruservicos
            token: ${{ secrets.GH_PAT }} # token de acesso se o repo for privado
            path: app
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
           node-version: '18'
        - name: Instalar dependências
          run: |
            cd web
            npm install
        - name: Start backend da aplicação
          run: |
            cd app/docker
            docker compose up -d
            # Espera a aplicação estar pronta
            sleep 30
        - name: Esperar aplicação rodando
          run: npx wait-on http://localhost:8080   

        - name: Ajustar permissão do Cypress
          run: |
            cd web
            chmod +x node_modules/.bin/cypress
        - name: Instalar binário Cypress
          run: |
            cd web
            npx cypress install
        - name: Rodar Cypress
          run: |
            cd web
            npx cypress run 
